<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storcenter Nord Akvarium</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg" href="img/favicon.svg">
</head>

<body>

<audio id="bgMusic" autoplay loop>
    <source src="sound/bg.sound.wav" type="audio/wav">
</audio>
<main id="scene"> 
    <div class="bg" id="bg"></div>
    <div id="fishInfo"></div>

   
    <div> 
        <!-- Fiskene svømmer foran baggrunden -->
        <img src="img/Klovnefisk.svg" id="idKlovnefisk" class="fisk1" alt="Klovnefisk">
        <img src="img/Pincetfisk.svg" id="idPincetfisk" class="fisk2" alt="Pincetfisk">
        <img src="img/Dvaergkejser.svg" id="idDvaergkejser" class="fisk3" alt="Dvaergkejser">
        <img src="img/sortbaandet-kirurg.svg" id="idSortbaandet-kirurg" class="fisk4" alt="Sortbaandet Kirurg">
        <img src="img/lilla-lille-antias.svg" id="idLilla-lille-antia" class="fisk5" alt="Lilla lille Antias">
        <img src="img/orange-lille-antias.svg" id="idOrange-lille-antias" class="fisk6" alt="Orange lille Antias">
        <img src="img/rosa-lille-antias.svg" id="idRosa-lille-antias" class="fisk7" alt="Rosa lille Antias">

        <!-- Dekorationer -->
        <img src="img/orange-koral.svg" id="idorange-koral" class="orange-koral" alt="Orange koral">
        <img src="img/pink-koral.svg" id="idpink-koral" class="pink-koral" alt="Pink koral">
        <img src="img/alger.svg" id="idalger" class="alger" alt="Alger">
        <img src="img/bobble.svg" id="idbobble1" class="bubble1" alt="Boble">  
        <img src="img/bobble.svg" id="idbobble2" class="bubble2" alt="Boble">
        <img src="img/bobble.svg" id="idbobble3" class="bubble3" alt="Boble">
    </div>
</main>
  <!-- Overlay til klovnefisken -->
    <div id="overlayKlovnefisk" onclick="lukOverlay()">
        <img src="img/scene2.find-mig.png" alt="Klovnefisk">
    </div>
<script src="js/script.js"></script>
</body>
</html>
