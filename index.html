<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storcenter Nord Akvarium</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg" href="img/favicon.svg">
</head>

<body>
<audio id="bgMusic" autoplay loop>
    <source src="sound/bg.sound.wav" type="audio/wav">
</audio>
<main id="scene"> 
    <div class="bg" id="bg"></div>
    <div id="fishInfo"></div>
    
    <div id="fish-overlay" class="overlay">
    <button id="close-overlay" class="close-btn">✕</button>

    <img id="overlay-nemo" src="img/overlay-img.tiff" alt="overlay-nemo">

    <audio id="klovnfisk.nemo"></audio>
    </div>
       

        <!-- Fiskene svømmer foran baggrunden -->
        <img src="img/Klovnefisk.svg" id="idKlovnefisk" class="fisk1">
        <img src="img/Pincetfisk.svg" id="idPincetfisk" class="fisk2">
        <img src="img/Dvaergkejser.svg" id="idDvaergkejser" class="fisk3">
        <img src="img/sortbaandet-kirurg.svg" id="idSortbaandet-kirurg" class="fisk4">
        <img src="img/lilla-lille-antias.svg" id="idLilla-lille-antia" class="fisk5">
        <img src="img/orange-lille-antias.svg" id="idOrange-lille-antias" class="fisk6">
        <img src="img/rosa-lille-antias.svg" id="idRosa-lille-antias" class="fisk7"> 

        <!-- Dekorationer -->
        <img src="img/orange-koral.svg" id="idorange-koral" class="orange-koral">
        <img src="img/pink-koral.svg" id="idpink-koral" class="pink-koral">
        <img src="img/alger.svg" id="idalger" class="alger">
        <img src="img/bobble.svg" id="idbobble1" class="bubble1">  
        <img src="img/bobble.svg" id="idbobble2" class="bubble2">
        <img src="img/bobble.svg" id="idbobble3" class="bubble3">
</main>
<script src="js/script.js"></script>
</body>
</html>
